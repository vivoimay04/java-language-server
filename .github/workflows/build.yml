name: Build java-language-server

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Prepare dist
        run: |
          mkdir -p artifact/classpath
          cp -r dist/lang_server_linux.sh artifact/
          cp -r dist/launch_linux.sh artifact/
          find target -name "*.jar" ! -name "*test*" -exec cp {} artifact/classpath/ \;
          mvn -B dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=artifact/classpath 2>/dev/null || true
          ls -la artifact/classpath/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-language-server-dist
          path: artifact/
